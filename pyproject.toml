[project]
name = "artwork"
authors = [{ name = "Packaged Sounds", email = "hello@packagedsounds.com" }]
description = "Artwork proofing for Packaged Sounds: supplier templates, spot layers, colour fixes, preflight and customer approval"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pikepdf>=9.0",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyspellchecker>=0.8",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
