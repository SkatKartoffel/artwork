<style>
	.aw { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; font-size: 15px; font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; }
	.aw-head { background: {{ brand_colour }}; color: #fff; padding: 22px 26px; border-radius: 0 0 12px 12px; margin-bottom: 28px; }
	.aw-head h1 { color: #fff; font-size: 22px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
	.aw-head .sub { opacity: .75; margin-top: 4px; }
	.aw-card { border: 1px solid #e3e3e3; border-radius: 12px; padding: 20px; margin-bottom: 20px; background: #fff; }
	.aw-card h3 { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
	.aw-muted { color: #777; font-size: 13px; }
	.aw-prev { width: 100%; border-radius: 8px; background: #f2f2f2; margin: 14px 0; }
	.aw-issue { font-size: 13px; padding: 6px 10px; border-radius: 6px; margin: 4px 0; }
	.aw-issue.Error { background: #fdecec; color: #a11; }
	.aw-issue.Warning { background: #fff5e5; color: #8a5300; }
	.aw-btn { display: inline-block; border: 0; border-radius: 8px; padding: 11px 20px; font-weight: 700; cursor: pointer; text-decoration: none; }
	.aw-btn.primary { background: {{ brand_colour }}; color: #fff; }
	.aw-btn.ghost { background: #f1f1f1; color: #111; }
	.aw-btn.ok { background: #17803d; color: #fff; }
	.aw-btn:disabled { opacity: .5; cursor: default; }
	.aw input[type=text], .aw textarea { width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px; font-size: 15px; }
	.aw-pill { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 20px; background: #eee; margin-left: 6px; }
	.aw-pill.ok { background: #e3f5e8; color: #17803d; }
	.aw-msg { padding: 14px 18px; border-radius: 10px; margin: 16px 0; }
	.aw-msg.ok { background: #e3f5e8; color: #135c2d; }
	.aw-msg.err { background: #fdecec; color: #a11; }
	.aw-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
</style>
